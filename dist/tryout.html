<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖间 · 体验反馈</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/visual.css"><link rel="stylesheet" href="/refined.css"><link rel="stylesheet" href="/tryout.css"><script type="module" src="/tryout.js"></script></head><body><main class="tryout"><a class="text-btn" href="/">← 返回栖间</a><h1>帮我们试一次入住。</h1><p>请亲自完成下面三个任务。成功、失败和需要帮助的地方都值得记录。反馈只保存在当前浏览器，由你主动导出，不自动上传。</p><form id="tryout-form"><label class="field"><span class="field-label">体验酒店</span><input name="hotel" class="text-input" required maxlength="100" placeholder="例如：三亚亚龙湾美高梅度假酒店"></label><button class="primary" type="button" id="start-trial">开始计时并打开产品 ↗</button><section><h2>1. 发现一个体验</h2><p>搜索一家酒店，打开体验列表，查看一个你感兴趣的项目及资料来源，再收藏它。</p><label class="field"><span class="field-label">完成情况</span><select name="task1" required><option value="">请选择</option><option>独立完成</option><option>需要帮助</option><option>未完成</option></select></label><label class="field"><span class="field-label">有没有发现原本不知道的体验？写名称；没有就写“没有”。</span><textarea name="discovery" rows="2" required maxlength="1000"></textarea></label></section><section><h2>2. 排一段空闲时间</h2><p>设置同行人、兴趣和90或120分钟，生成安排。检查项目是否符合你的需求，再打开参与条件。</p><label class="field"><span class="field-label">完成情况</span><select name="task2" required><option value="">请选择</option><option>独立完成</option><option>需要帮助</option><option>未完成</option></select></label><label class="field"><span class="field-label">这份安排你愿意采用吗？哪些地方不合适？</span><textarea name="usefulness" rows="3" required maxlength="2000"></textarea></label></section><section><h2>3. 改一项，再回来</h2><p>保留一个时段，替换或移除另一项；刷新页面进入“我的安排”，检查刚才的改动是否还在。</p><label class="field"><span class="field-label">完成情况</span><select name="task3" required><option value="">请选择</option><option>独立完成</option><option>需要帮助</option><option>未完成</option></select></label><label class="field"><span class="field-label">最困惑、最想改进的地方</span><textarea name="friction" rows="3" required maxlength="2000"></textarea></label></section><label class="field"><span class="field-label">使用环境</span><select name="device"><option>手机浏览器</option><option>电脑浏览器</option><option>其他</option></select></label><label class="check"><input type="checkbox" name="attested" required>我是亲自操作的体验者；以上是我的真实反馈。</label><button type="submit" class="primary">导出反馈文件</button><p class="note">任务结果由你自行报告；计时是打开试用到填写反馈的总时长，不等于系统响应速度。不要填写手机号、住店订单或其他隐私。</p><p id="trial-status" role="status"></p></form></main></body></html>
