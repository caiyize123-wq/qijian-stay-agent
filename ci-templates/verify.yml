name: Verify reproducible package
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  clean-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic tests
        run: npm test
      - name: Fresh database startup without shared credentials
        run: node scripts/smoke-release.mjs
